<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Solivant Studios — Logo Animation</title>
  <style>
    :root { color-scheme: dark; background: #0c0d10; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body { display: grid; place-items: center; overflow: hidden; background: #0c0d10; color: #5ad2e6; }
    .stage { width: min(420px, 72vw); }
    svg { display: block; width: 100%; height: auto; overflow: visible; }
    .pulse { fill: none; stroke: currentColor; stroke-width: 8.1; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 100; stroke-dashoffset: 100; animation: draw 850ms cubic-bezier(.33,0,.15,1) 220ms forwards; }
    .word { opacity: 0; animation: reveal 420ms ease 760ms forwards; }
    .rule { opacity: 0; transform-origin: center; animation: rule-in 550ms cubic-bezier(.33,0,.15,1) 1.22s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes reveal { to { opacity: 1; } }
    @keyframes rule-in { from { opacity: 0; transform: scaleX(.3); } to { opacity: 1; transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) {
      .pulse, .word, .rule { animation: none; opacity: 1; stroke-dashoffset: 0; transform: none; }
    }
  </style>
</head>

  <main class="stage" aria-label="Solivant Studios logo animation">
    <svg viewBox="0 0 300 174" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title">

</html>
